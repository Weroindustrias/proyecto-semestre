<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Inteligente de Tareas | React + Programación Funcional</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260925-1">
    <!-- Aplica el tema guardado (claro/oscuro) antes de pintar la página, para evitar parpadeos -->
    <script>
        (function () {
            try {
                var guardado = localStorage.getItem('pf_theme');
                var tema = guardado === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Import Map para React 18 nativo en Navegador & Electron -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <!-- Punto de Montaje de la Aplicación React -->
    <div id="root">
        <div
            style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; color:var(--text-primary); font-family:var(--font-main);">
            <div style="font-size:3rem; margin-bottom:1rem; animation: pulse 1.5s infinite;">⚡</div>
            <h2 style="margin-bottom:0.5rem;">Cargando Organizador Inteligente en React...</h2>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1.5rem;">Inicializando componentes
                funcionales y base pedagógica</p>
            <noscript>
                <div
                    style="padding:1rem 1.5rem; background:rgba(239,68,68,0.15); border:1px solid #ef4444; border-radius:12px;">
                    Se requiere JavaScript para ejecutar la aplicación. También puedes abrir <a
                        href="index_vanilla.html" style="color:#38bdf8;">index_vanilla.html</a>.
                </div>
            </noscript>
            <div id="offline-fallback"
                style="display:none; margin-top:1rem; padding:1rem 1.5rem; background:rgba(56,189,248,0.1); border:1px solid var(--accent-blue); border-radius:12px; text-align:center;">
                <p style="margin:0 0 0.5rem 0;">¿Estás ejecutando sin conexión a internet?</p>
                <a href="index_vanilla.html" class="btn-primary"
                    style="display:inline-block; text-decoration:none; padding:8px 16px;">
                    Abrir versión directa sin conexión (index_vanilla.html)
                </a>
            </div>
        </div>
    </div>

    <!-- Script de detección de carga / fallback offline -->
    <script>
        setTimeout(function () {
            var rootEl = document.getElementById('root');
            if (rootEl && (!rootEl.firstElementChild || rootEl.firstElementChild.id !== 'app-container')) {
                var fallbackBox = document.getElementById('offline-fallback');
                if (fallbackBox) fallbackBox.style.display = 'block';
            }
        }, 3500);
    </script>

    <!-- Carga del Componente Raíz de React -->
    <script type="text/babel" data-type="module" src="./src/main.jsx"></script>
</body>

</html>
